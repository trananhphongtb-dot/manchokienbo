name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Nếu có khóa ký trong Secrets thì dùng để ký bản phát hành (AAB cho Google Play)
      - name: Giải mã khóa ký (nếu có)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Đã có khóa ký"
          else
            echo "Không có khóa ký, chỉ dựng bản APK thử"
          fi

      - name: Dựng APK thử
        run: gradle assembleDebug --no-daemon

      - name: Dựng AAB phát hành
        if: ${{ hashFiles('app/release.jks') != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      # Chưa có khóa trong Secrets: dựng AAB chưa ký, đăng lên mục Releases để ký riêng
      - name: Dựng AAB chưa ký
        if: ${{ hashFiles('app/release.jks') == '' }}
        run: gradle bundleRelease --no-daemon

      - name: Đăng AAB chưa ký lên Releases
        if: ${{ hashFiles('app/release.jks') == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-build-${{ github.run_number }}
          name: AAB chưa ký (build ${{ github.run_number }})
          prerelease: true
          files: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ManChoKienBo-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/release.jks') != '' }}
        with:
          name: ManChoKienBo-aab
          path: app/build/outputs/bundle/release/*.aab
