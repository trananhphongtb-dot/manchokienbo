plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phongtb.manchokienbo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phongtb.manchokienbo'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Ký bản release nếu có khóa (đặt qua GitHub Secrets, xem README)
    def ksFile = file('release.jks')
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
